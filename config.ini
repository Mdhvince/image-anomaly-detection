# Configuration Dinomaly - valeurs du papier (MVTec-AD, regimen multi-class).
# Le regimen leger de test vit dans la section [demo].

[dataset]
data_root = ../datasets/mvtec_anomaly_detection

[model]
backbone = dinov2_vitb14_reg
# 8 couches du milieu sur 12
target_layers = 2,3,4,5,6,7,8,9
embed_dim = 768
drop_rate = 0.2
# groupes bas niveau ; haut niveau
groups = 0,1,2,3;4,5,6,7

[preprocessing]
img_size = 448
# 392 / 14 = 28x28 tokens
crop_size = 392

[training]
batch_size = 16
num_workers = 4
# budget du papier, converti en epochs: ceil(num_iterations / batches par epoch)
num_iterations = 10000
# fraction des images normales d'entrainement reservees a la validation
valid_ratio = 0.2
lr = 2e-3
final_lr = 2e-4
weight_decay = 1e-4
warmup_iterations = 100
max_grad_norm = 0.1
# fraction de points faciles dont le gradient est reduit
final_mining_percent = 0.9
mining_ramp_iters = 1000
# le sg(.)_0.1 du papier
shrink_factor = 0.1

[evaluation]
# score image = moyenne du top 1% de la carte
top_pixel_ratio = 0.01

[demo]
# passed a false pour le regimen papier complet
enabled = true
img_size = 224
crop_size = 224
batch_size = 4
num_iterations = 1500
